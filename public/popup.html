<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GlassMOOCs</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <section class="popup-hero">
        <p class="popup-eyebrow">GlassMOOCs</p>
        <h1>資料収集</h1>
        <p class="popup-lead">
          現在の MOOCS ページから資料保存や科目収集を開始します。
        </p>
      </section>

      <section class="popup-card">
        <p class="popup-section-title">現在のページ</p>
        <div id="page-context" class="popup-context">
          MOOCs ページを確認しています...
        </div>
        <div class="popup-actions">
          <button
            id="collect-course-button"
            type="button"
            class="primary-button"
          >
            この科目を収集
          </button>
          <button
            id="download-lecture-button"
            type="button"
            class="secondary-button"
          >
            この回の資料を全部保存
          </button>
          <button
            id="download-page-button"
            type="button"
            class="secondary-button"
          >
            このページの資料を保存
          </button>
        </div>
      </section>

      <section
        id="slides-permission-card"
        class="popup-card"
        style="display: none"
      >
        <p class="popup-section-title">Slides キャプチャ</p>
        <p class="popup-context">
          高速エクスポートが失敗した場合のみ、表示中タブのキャプチャ許可を使って保存します。
        </p>
        <p
          id="slides-permission-status"
          class="popup-context"
          style="display: none"
        ></p>
        <div class="popup-actions">
          <button
            id="grant-slides-permission-button"
            type="button"
            class="primary-button"
          >
            Slides キャプチャを許可
          </button>
        </div>
      </section>

      <section class="popup-card">
        <div class="popup-status-header">
          <p class="popup-section-title">進捗</p>
          <button id="reset-state-button" type="button" class="inline-button">
            クリア
          </button>
        </div>
        <div id="download-progress" class="popup-progress" hidden>
          <div class="popup-progress-track">
            <div id="download-progress-bar" class="popup-progress-bar"></div>
          </div>
          <p id="download-progress-label" class="popup-progress-label"></p>
        </div>
        <div id="download-state" class="popup-status">
          状態を読み込んでいます...
        </div>
      </section>

      <!-- GLASSMOOCS_DEBUG_ONLY_START -->
      <section class="popup-card">
        <div class="popup-status-header">
          <p class="popup-section-title">Debug Log</p>
          <button
            id="refresh-debug-log-button"
            type="button"
            class="inline-button"
          >
            更新
          </button>
        </div>
        <pre id="debug-log-summary" class="popup-debug-summary">
読み込んでいます...
        </pre>
        <textarea
          id="debug-log-text"
          class="popup-debug-text"
          rows="10"
          readonly
          spellcheck="false"
        ></textarea>
      </section>
      <!-- GLASSMOOCS_DEBUG_ONLY_END -->

      <footer class="popup-footer">
        <button id="open-settings-button" type="button" class="inline-button">
          設定を開く
        </button>
      </footer>
    </main>

    <script src="popup/slides-permission-card.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
