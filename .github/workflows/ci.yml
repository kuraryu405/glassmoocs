name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ci
        run: pnpm run ci

      - name: Package dist zip for AMO
        run: |
          mkdir -p artifacts
          cd dist
          zip -r ../artifacts/glassmoocs-dist.zip .

      - name: Run AMO lint
        run: pnpm dlx addons-linter artifacts/glassmoocs-dist.zip
